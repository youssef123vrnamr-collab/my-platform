<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>سلم 3D – عالم كبير</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{overflow:hidden;background:#000;font-family:Arial;}
  canvas{display:block;width:100vw;height:100vh;}
  #upBtn,#downBtn{
    position:fixed;bottom:30px;width:75px;height:75px;
    border-radius:50%;border:3px solid #fff;background:rgba(0,100,255,0.7);
    color:#fff;font-size:32px;cursor:pointer;z-index:100;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    box-shadow:0 0 15px rgba(0,100,255,0.5);
  }
  #upBtn{bottom:130px;right:20px;}
  #downBtn{bottom:30px;right:20px;}
  #info{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:16px;z-index:100;text-align:center;
    background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:8px;
  }
  #stepInfo{
    position:fixed;top:50px;left:50%;transform:translateX(-50%);
    color:#ffcc00;font-size:18px;z-index:100;text-align:center;
    background:rgba(0,0,0,0.5);padding:5px 14px;border-radius:8px;
  }
</style>
</head>
<body>
<div id="info">🪜 سلم 3D – استخدم الأزرار أو الأسهم أو السحب</div>
<div id="stepInfo">الدرجة: 0</div>
<button id="upBtn">▲</button>
<button id="downBtn">▼</button>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ===== المشهد والكاميرا ===== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 30, 80);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(8, 8, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ===== الإضاءة ===== */
scene.add(new THREE.AmbientLight(0x334466, 1.0));
const sun = new THREE.DirectionalLight(0xffeedd, 1.8);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 100;
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -10;
scene.add(sun);

const moonLight = new THREE.DirectionalLight(0x4466aa, 0.4);
moonLight.position.set(-5, 10, -5);
scene.add(moonLight);

/* ===== التحكم بالكاميرا ===== */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 8, 0);
controls.minDistance = 3;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI / 2.05;

/* ===== المواد ===== */
const woodMat = new THREE.MeshLambertMaterial({ color: 0x8B5E3C });
const woodDarkMat = new THREE.MeshLambertMaterial({ color: 0x6B3A1F });
const railMat = new THREE.MeshLambertMaterial({ color: 0x553311 });
const groundMat = new THREE.MeshLambertMaterial({ color: 0x2a2a1a });
const grassMat = new THREE.MeshLambertMaterial({ color: 0x1a4a1a });
const playerBodyMat = new THREE.MeshLambertMaterial({ color: 0x2266cc });
const playerHeadMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
const playerHairMat = new THREE.MeshLambertMaterial({ color: 0x331100 });
const playerEyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const playerShoeMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
const playerBeltMat = new THREE.MeshLambertMaterial({ color: 0x884400 });
const playerPantsMat = new THREE.MeshLambertMaterial({ color: 0x333355 });

/* ===== الأرضية والبيئة ===== */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* شريط عشب */
for (let i = 0; i < 20; i++) {
  const grass = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 0.5), grassMat);
  grass.position.set((i - 10) * 5, 0.05, -25);
  grass.receiveShadow = true;
  scene.add(grass);
  const grass2 = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 0.5), grassMat);
  grass2.position.set((i - 10) * 5, 0.05, 25);
  grass2.receiveShadow = true;
  scene.add(grass2);
}

/* نجوم في السماء */
const starGeom = new THREE.SphereGeometry(0.05, 4, 4);
const starMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (let i = 0; i < 200; i++) {
  const star = new THREE.Mesh(starGeom, starMat);
  star.position.set(
    (Math.random() - 0.5) * 100,
    Math.random() * 40 + 10,
    (Math.random() - 0.5) * 100
  );
  scene.add(star);
}

/* ===== بناء السلم الرئيسي (30 درجة) ===== */
const mainStepCount = 30;
const stepHeight = 0.6;
const stepDepth = 1.8;
const stepWidth = 2.5;
const mainTotalHeight = mainStepCount * stepHeight;

/* قضبان السلم الرئيسي */
const mainRailGeom = new THREE.CylinderGeometry(0.08, 0.08, mainTotalHeight + 0.5, 8);
const mainLeftRail = new THREE.Mesh(mainRailGeom, railMat);
mainLeftRail.position.set(-stepWidth / 2, (mainTotalHeight + 0.5) / 2, 0);
mainLeftRail.castShadow = true;
scene.add(mainLeftRail);
const mainRightRail = new THREE.Mesh(mainRailGeom, railMat);
mainRightRail.position.set(stepWidth / 2, (mainTotalHeight + 0.5) / 2, 0);
mainRightRail.castShadow = true;
scene.add(mainRightRail);

/* درجات السلم الرئيسي */
for (let i = 0; i < mainStepCount; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(stepWidth, 0.12, stepDepth), woodMat);
  step.position.set(0, i * stepHeight + 0.06, 0);
  step.castShadow = true;
  step.receiveShadow = true;
  scene.add(step);
}

/* ===== بناء سلم ثاني (20 درجة) على الجنب ===== */
const secondStepCount = 20;
const secondStepHeight = 0.5;
const secondStepDepth = 1.6;
const secondStepWidth = 2.0;
const secondTotalHeight = secondStepCount * secondStepHeight;
const secondBaseX = 5;
const secondBaseZ = 3;

const secRailGeom = new THREE.CylinderGeometry(0.07, 0.07, secondTotalHeight + 0.4, 8);
const secLeftRail = new THREE.Mesh(secRailGeom, railMat);
secLeftRail.position.set(secondBaseX - secondStepWidth / 2, (secondTotalHeight + 0.4) / 2, secondBaseZ);
secLeftRail.castShadow = true;
scene.add(secLeftRail);
const secRightRail = new THREE.Mesh(secRailGeom, railMat);
secRightRail.position.set(secondBaseX + secondStepWidth / 2, (secondTotalHeight + 0.4) / 2, secondBaseZ);
secRightRail.castShadow = true;
scene.add(secRightRail);

for (let i = 0; i < secondStepCount; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(secondStepWidth, 0.1, secondStepDepth), woodDarkMat);
  step.position.set(secondBaseX, i * secondStepHeight + 0.05, secondBaseZ);
  step.castShadow = true;
  step.receiveShadow = true;
  scene.add(step);
}

/* ===== سلم ثالث (15 درجة) على الجانب التاني ===== */
const thirdStepCount = 15;
const thirdStepHeight = 0.45;
const thirdStepDepth = 1.5;
const thirdStepWidth = 1.8;
const thirdTotalHeight = thirdStepCount * thirdStepHeight;
const thirdBaseX = -5;
const thirdBaseZ = -4;

const thirdRailGeom = new THREE.CylinderGeometry(0.06, 0.06, thirdTotalHeight + 0.3, 8);
const thirdLeftRail = new THREE.Mesh(thirdRailGeom, railMat);
thirdLeftRail.position.set(thirdBaseX - thirdStepWidth / 2, (thirdTotalHeight + 0.3) / 2, thirdBaseZ);
thirdLeftRail.castShadow = true;
scene.add(thirdLeftRail);
const thirdRightRail = new THREE.Mesh(thirdRailGeom, railMat);
thirdRightRail.position.set(thirdBaseX + thirdStepWidth / 2, (thirdTotalHeight + 0.3) / 2, thirdBaseZ);
thirdRightRail.castShadow = true;
scene.add(thirdRightRail);

for (let i = 0; i < thirdStepCount; i++) {
  const step = new THREE.Mesh(new THREE.BoxGeometry(thirdStepWidth, 0.09, thirdStepDepth), woodMat);
  step.position.set(thirdBaseX, i * thirdStepHeight + 0.045, thirdBaseZ);
  step.castShadow = true;
  step.receiveShadow = true;
  scene.add(step);
}

/* ===== اللاعب (شخصية مفصّلة) ===== */
const player = new THREE.Group();

/* الجسم */
const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.25), playerBodyMat);
body.position.y = 0.35;
body.castShadow = true;
player.add(body);

/* الرأس */
const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), playerHeadMat);
head.position.y = 0.9;
head.castShadow = true;
player.add(head);

/* الشعر */
const hair = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2), playerHairMat);
hair.position.y = 0.95;
player.add(hair);

/* العيون */
const eyeGeom = new THREE.SphereGeometry(0.03, 6, 6);
const leftEye = new THREE.Mesh(eyeGeom, playerEyeMat);
leftEye.position.set(-0.07, 0.92, 0.17);
player.add(leftEye);
const rightEye = new THREE.Mesh(eyeGeom, playerEyeMat);
rightEye.position.set(0.07, 0.92, 0.17);
player.add(rightEye);

/* الذراع اليسرى */
const armGeom = new THREE.BoxGeometry(0.1, 0.55, 0.1);
const leftArm = new THREE.Mesh(armGeom, playerBodyMat);
leftArm.position.set(-0.28, 0.42, 0);
leftArm.castShadow = true;
player.add(leftArm);

/* الذراع اليمنى */
const rightArm = new THREE.Mesh(armGeom, playerBodyMat);
rightArm.position.set(0.28, 0.42, 0);
rightArm.castShadow = true;
player.add(rightArm);

/* الساق اليسرى */
const legGeom = new THREE.BoxGeometry(0.12, 0.6, 0.12);
const leftLeg = new THREE.Mesh(legGeom, playerPantsMat);
leftLeg.position.set(-0.12, 0.15, 0);
leftLeg.castShadow = true;
player.add(leftLeg);

/* الساق اليمنى */
const rightLeg = new THREE.Mesh(legGeom, playerPantsMat);
rightLeg.position.set(0.12, 0.15, 0);
rightLeg.castShadow = true;
player.add(rightLeg);

/* الحذاء اليسرى */
const shoeGeom = new THREE.BoxGeometry(0.14, 0.08, 0.2);
const leftShoe = new THREE.Mesh(shoeGeom, playerShoeMat);
leftShoe.position.set(-0.12, 0.03, 0);
leftShoe.castShadow = true;
player.add(leftShoe);

/* الحذاء اليمنى */
const rightShoe = new THREE.Mesh(shoeGeom, playerShoeMat);
rightShoe.position.set(0.12, 0.03, 0);
rightShoe.castShadow = true;
player.add(rightShoe);

/* الحزام */
const belt = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.05, 0.28), playerBeltMat);
belt.position.y = 0.55;
belt.castShadow = true;
player.add(belt);

/* وضع اللاعب في المشهد */
player.position.set(0, 0, 0);
scene.add(player);

/* ===== التحكم في السلالم (الأزرار) ===== */
let currentStep = 0;
const maxStep = mainStepCount - 1;
const stepInfo = document.getElementById('stepInfo');

function updateStepInfo() {
  stepInfo.textContent = `الدرجة: ${currentStep}`;
}
updateStepInfo();

function movePlayerToStep(step) {
  const y = step * stepHeight + 0.35; // يضع الجسم على ارتفاع الدرجة
  player.position.y = y;
  currentStep = step;
  updateStepInfo();
}

/* أزرار التحكم */
document.getElementById('upBtn').addEventListener('click', () => {
  if (currentStep < maxStep) movePlayerToStep(currentStep + 1);
});
document.getElementById('downBtn').addEventListener('click', () => {
  if (currentStep > 0) movePlayerToStep(currentStep - 1);
});

/* تحكم بالمفاتيح */
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    if (currentStep < maxStep) movePlayerToStep(currentStep + 1);
  } else if (e.key === 'ArrowDown') {
    if (currentStep > 0) movePlayerToStep(currentStep - 1);
  }
});

/* ===== حلقة الرسم ===== */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ===== تعديل حجم النافذة ===== */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
